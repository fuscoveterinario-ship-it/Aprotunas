<style>
:root{--green:#2e7d32;--green-d:#1f5c24;--green-l:#e8f2e4;--text:#22281f;--muted:#6b7565;--line:#e2e7db;--amber:#e0a938}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);
  background:linear-gradient(160deg,#2e7d32,#1f5c24);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:18px;box-shadow:0 16px 50px rgba(0,0,0,.25);width:100%;max-width:440px;overflow:hidden}
.hd{padding:22px 24px 16px;text-align:center;border-bottom:1px solid var(--line)}
.hd img{height:56px;margin-bottom:8px}
.hd .assoc{font-size:12px;color:var(--muted)}
.hd h1{font-family:Fraunces,serif;font-size:19px;color:var(--green-d);margin:2px 0 0}
.badge{display:inline-block;margin-top:10px;background:var(--green-l);color:var(--green-d);
  font-weight:700;font-size:13px;padding:6px 14px;border-radius:20px;letter-spacing:.5px}
.body{padding:20px 24px 8px}
.rastnum{text-align:center;margin-bottom:16px}
.rastnum .lbl{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.rastnum .num{font-family:Fraunces,serif;font-size:24px;font-weight:700;color:var(--green-d);letter-spacing:1px}
.prod{text-align:center;margin-bottom:18px}
.prod .nome{font-family:Fraunces,serif;font-size:26px;color:var(--text)}
.prod .qt{font-size:13px;color:var(--muted);margin-top:2px}
dl{display:grid;grid-template-columns:auto 1fr;gap:11px 16px;margin:0;font-size:14px}
dt{color:var(--muted);font-weight:600}
dd{margin:0;text-align:right;font-weight:600}
.ic{margin-right:6px}
.dist{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.dist-h{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.dist-item{background:var(--green-l);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.dist-item .dest{font-weight:700;color:var(--green-d)}
.dist-item .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.ft{padding:16px 24px 22px;text-align:center;color:var(--muted);font-size:11.5px;border-top:1px solid var(--line);margin-top:14px}
.ft b{color:var(--green-d)}
.loading,.erro{padding:60px 24px;text-align:center;color:var(--muted)}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.erro .big{font-size:40px;margin-bottom:8px}
</style>
</head>

const sb=window.supabase.createClient(SB_URL,SB_KEY);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dBR=d=>{ if(!d) return "—"; const p=String(d).slice(0,10).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; };
const NUM=n=>(Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
const params=new URLSearchParams(location.search);
const r=params.get('r')||params.get('rastreio');

async function run(){
  const card=document.getElementById('card');
  if(!r){ card.innerHTML=erroHTML('Código não informado','Escaneie o QR Code da etiqueta.'); return; }
  const { data, error } = await sb.rpc('aprotunas_rastreio_publico',{ p_rastreio:r });
  if(error){ card.innerHTML=erroHTML('Erro na consulta','Tente novamente em instantes.'); return; }
  if(!data){ card.innerHTML=erroHTML('Rastreio não encontrado','O código '+esc(r)+' não consta na base da associação.'); return; }
  const d=data;
  card.innerHTML=`
    <div class="hd">
      <img src="${LOGO}" alt="APROTUNAS">
      <div class="assoc">${esc(d.associacao||'APROTUNAS')}${d.sim?' · SIM '+esc(d.sim):''}</div>
      <h1>Rastreabilidade do produto</h1>
      <span class="badge">✓ ORIGEM VERIFICADA</span>
    </div>
    <div class="body">
      <div class="rastnum"><div class="lbl">Nº de rastreabilidade</div><div class="num">${esc(d.rastreio)}</div></div>
      <div class="prod"><div class="nome">${esc(d.produto)}</div>
        <div class="qt">${NUM(d.quantidade)} ${esc(d.unidade||'')}${d.gramagem?' · '+esc(d.gramagem):''}</div></div>
      <dl>
        <dt><span class="ic">👨‍🌾</span>Produtor</dt><dd>${esc(d.produtor)}</dd>
        <dt><span class="ic">📍</span>Origem</dt><dd>${esc(d.municipio||'—')}${d.uf?'/'+esc(d.uf):''}</dd>
        <dt><span class="ic">📅</span>Recebido em</dt><dd>${dBR(d.data)}</dd>
        ${d.projeto?`<dt><span class="ic">🏫</span>Projeto</dt><dd>${esc(d.projeto)}</dd>`:''}
      </dl>
      ${(d.distribuicoes&&d.distribuicoes.length)?`
      <div class="dist">
        <div class="dist-h">🚚 Para onde foi</div>
        ${d.distribuicoes.map(x=>`<div class="dist-item">
          <div class="dest">${esc(x.local||x.projeto||'Destino')}</div>
          <div class="meta">Enviado em <b>${dBR(x.data)}</b> · ${NUM(x.quantidade)} ${esc(x.unidade||'')}${x.projeto&&x.local?' · '+esc(x.projeto):''}</div>
        </div>`).join('')}
      </div>`:''}
      <div class="ft">Alimento da agricultura familiar, rastreado pela <b>${esc(d.associacao||'APROTUNAS')}</b> — da origem à sua mesa.</div>
    </div>`;
}
function erroHTML(t,s){ return `<div class="hd"><img src="${LOGO}" alt="APROTUNAS"><h1>Rastreabilidade APROTUNAS</h1></div>
  <div class="erro"><div class="big">🔍</div><div style="font-weight:700;color:var(--text);font-size:16px;margin-bottom:4px">${esc(t)}</div><div>${esc(s)}</div></div>`; }
run();
</script>
